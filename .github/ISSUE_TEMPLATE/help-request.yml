name: 使用求助
description: 咨询安装、配置或使用方法，排查尚未确认的故障
title: "[Help] "
labels: ["求助"]
body:
  - type: markdown
    attributes:
      value: |
        这里适合提交安装、配置和使用问题。能够稳定复现的软件故障请改用“错误反馈”。

        提交 Issue 前请先公开 Star 当前项目。Issue 创建后会自动核验；未通过时会先礼貌提醒并保持开放，10 分钟后仍未公开 Star 才会暂时关闭。

        请勿提交 token、签名、私钥、设备标识、Cookie 或其他个人数据。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已公开 Star 当前项目，并了解收到提醒后超过 10 分钟仍未通过核验的 Issue 会被暂时关闭。
          required: true
        - label: 我已阅读 README 的下载与使用说明，并搜索过现有 Issue。
          required: true
        - label: 我已删除日志、截图和链接中的敏感信息。
          required: true
  - type: input
    id: version
    attributes:
      label: 应用版本
      description: 请填写完整版本号；尚未安装时填写“未安装”。
      placeholder: 例如 v2026.7.26-709
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: 运行平台
      options:
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
        - 其他
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统版本与架构
      placeholder: 例如 macOS 15 arm64；Ubuntu 24.04 x64
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: 具体问题
      description: 说明你想完成什么、卡在哪一步，以及当前看到的结果。
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已尝试的方法
      description: 列出已经查看的文档、尝试过的操作及其结果，避免重复排查。
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: 脱敏日志或截图
      description: 可附完整错误文本和截图；删除 query、token、签名、Cookie 和设备 ID。
