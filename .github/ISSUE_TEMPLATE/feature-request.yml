name: 功能建议
description: 描述使用场景并提出新功能或改进建议
title: "[Feature] "
labels: ["增强功能"]
body:
  - type: markdown
    attributes:
      value: |
        感谢你的建议。请先说清要解决的实际问题，再描述希望采用的方案。

        提交前请先读一下[产品边界](https://github.com/POf-L/Fanqie-novel-Downloader/blob/main/CONTRIBUTING.md#产品边界)：表里列出的方向不会做，相关建议会直接关闭。
  - type: checkboxes
    id: preflight
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，确认没有相同或高度相似的建议。
          required: true
        - label: 这是一项具体的软件功能建议，不是安全漏洞、推广或商务合作信息。
          required: true
        - label: 我读过 CONTRIBUTING 中的“产品边界”，这项建议不属于明确不做的范围。
          required: true
  - type: dropdown
    id: platforms
    attributes:
      label: 涉及平台
      multiple: true
      options:
        - 全部平台
        - Windows
        - macOS
        - Linux
        - Android
        - iOS
    validations:
      required: true
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 当前在什么情况下遇到了什么不便？谁会受益？
      placeholder: 描述真实使用过程和目前的限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明希望增加或调整什么行为，尽量描述完整交互和边界。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 说明目前尝试过的办法，以及为什么仍不能满足需求；没有可留空。
  - type: textarea
    id: additional
    attributes:
      label: 补充信息
      description: 可提供界面截图、示例或相关资料；请勿包含敏感信息。
