name: CI / 仓库校验

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "README.md"
      - "CONTRIBUTING.md"
      - "SECURITY.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tooling:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    steps:
      - name: Checkout wrapper
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Run release tooling tests
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: Compile release tooling
        shell: bash
        run: python -m py_compile scripts/*.py

      - name: Lint GitHub Actions workflows
        uses: docker://rhysd/actionlint@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9 # 1.7.7
        with:
          args: -no-color
