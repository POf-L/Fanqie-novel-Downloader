name: Temporary private Node test diagnosis

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private Tauri source commit to test
        required: true
        default: "2508bfa5a10bf6a16490f878435075558edfd60f"
        type: string

permissions:
  contents: read

jobs:
  node-test:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Checkout private Tauri source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: POf-L/Fanqie-novel-Downloader-tauri
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.PRIVATE_SOURCE_TOKEN }}
          persist-credentials: false
          path: private-src
          fetch-depth: 1

      - name: Set up Node.js 22.23.5
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.23.5

      - name: Run tests; print only failing test names
        working-directory: private-src
        shell: bash
        run: |
          set -u
          output="$(mktemp "${RUNNER_TEMP}/node-test.XXXXXX")"
          trap 'rm -f "${output}"' EXIT
          set +e
          node --test tests/*.js >"${output}" 2>&1
          status=$?
          set -e
          if [[ "${status}" -eq 0 ]]; then
            echo "Node tests passed."
            exit 0
          fi
          echo "Node tests failed. Showing failing test names only:"
          python3 - "${output}" <<'PY'
          import json
          import re
          import sys

          names = []
          with open(sys.argv[1], encoding="utf-8", errors="replace") as stream:
              for line in stream:
                  match = re.match(r"^\s*not ok\s+\d+\s+-\s+(.+?)\s*$", line)
                  if match:
                      names.append(match.group(1)[:240])
          if names:
              for name in names:
                  print(json.dumps(name, ensure_ascii=False))
          else:
              print("No failing test name was emitted before the runner exited.")
          PY
          exit "${status}"
