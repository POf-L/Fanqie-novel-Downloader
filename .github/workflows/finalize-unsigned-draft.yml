name: Finalize Unsigned Draft Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "已有 unsigned-* 草稿 Tag"
        required: true
        type: string
      mode:
        description: "发布为普通 Release 或 prerelease"
        required: true
        default: "formal"
        type: choice
        options:
          - formal
          - prerelease
      release_highlights:
        description: "可选的发布要点，每行一项"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: unsigned-draft-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Validate and publish existing unsigned draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
          MODE: ${{ inputs.mode }}
          RELEASE_HIGHLIGHTS: ${{ inputs.release_highlights }}
        run: |
          set -euo pipefail
          arguments=(
            --repo "${GH_REPO}"
            --tag "${TAG_NAME}"
            --mode "${MODE}"
          )
          if [[ -n "${RELEASE_HIGHLIGHTS//[[:space:]]/}" ]]; then
            printf '%s\n' "${RELEASE_HIGHLIGHTS}" > release-highlights.md
            arguments+=(--highlights-file release-highlights.md)
          fi
          python scripts/finalize-unsigned-release.py "${arguments[@]}"
