name: Require a Star for New Issues

on:
  issues:
    types: [opened]

# IMPORTANT: GitHub restricted the stargazers API (June 2026) to only admins/collaborators.
# The default GITHUB_TOKEN from Actions often fails listStargazersForRepo now.
#
# 你可以复用现有的 PRIVATE_SOURCE_TOKEN（用来从隐身仓库拉源码的那个），
# 因为它通常是由仓库 owner 创建的，具有足够的权限。
#
# 推荐做法（优先级）：
# 1. 新建一个专用的 STAR_GATE_TOKEN（最小权限，最安全）
# 2. 或者直接复用 PRIVATE_SOURCE_TOKEN
# 3. 最后回退到 GITHUB_TOKEN（大概率失败）
#
# 如果复用 PRIVATE_SOURCE_TOKEN，建议检查它的 fine-grained PAT 设置：
#   - 包含对本公开仓库（Fanqie-novel-Downloader）的访问
#   - 至少给 Contents = Read-only
permissions:
  contents: read
  issues: write

concurrency:
  group: issue-star-gate-${{ github.repository }}-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  check-star:
    name: Check issue author's star
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the stargazer list
        uses: actions/github-script@v9
        with:
          # 优先使用专用 token，其次复用你现有的 PRIVATE_SOURCE_TOKEN
          # （因为它通常是 owner 创建的 PAT，对本仓库也有访问权限，能读取 stargazers）
          # 最后才回退 GITHUB_TOKEN（大概率失败）
          github-token: ${{ secrets.STAR_GATE_TOKEN || secrets.PRIVATE_SOURCE_TOKEN || secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const author = issue?.user?.login;

            if (typeof author !== "string" || author.length === 0) {
              core.setFailed("The issue payload does not contain an author login.");
              return;
            }

            const { owner, repo } = context.repo;
            const normalizedAuthor = author.toLowerCase();
            let hasStar = false;

            // The endpoint is paginated. Stop as soon as the author is found
            // so a new issue does not need to read the entire list.
            for await (const response of github.paginate.iterator(
              github.rest.activity.listStargazersForRepo,
              { owner, repo, per_page: 100 },
            )) {
              if (response.data.some(
                (stargazer) =>
                  typeof stargazer.login === "string" &&
                  stargazer.login.toLowerCase() === normalizedAuthor,
              )) {
                hasStar = true;
                break;
              }
            }

            if (hasStar) {
              core.info(`${author} has starred ${owner}/${repo}; leaving the issue open.`);
              return;
            }

            const repositoryUrl = `https://github.com/${owner}/${repo}`;
            const comment = [
              `@${author}，感谢你提交 Issue。`,
              "",
              `提交 Issue 前，请先为本项目点 Star：${repositoryUrl}`,
              "",
              "完成后请重新提交一个新的 Issue，不要直接重新打开本 Issue。GitHub 只能通过公开的 Star 列表进行自动核验，请确保该 Star 对外可见。",
              "",
              "本 Issue 已自动关闭。",
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: comment,
            });
            await github.rest.issues.update({
              owner,
              repo,
              issue_number: issue.number,
              state: "closed",
              state_reason: "not_planned",
            });
            core.info(`Closed issue #${issue.number}: ${author} is not in the public stargazer list.`);
