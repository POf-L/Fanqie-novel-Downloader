name: 发布 / 维护工具

run-name: >-
  发布维护 / ${{ inputs.operation }} / ${{ inputs.tag || '当前稳定版' }}

# 只处理已有 Release 或草稿，不重新构建任何平台安装包。
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "维护操作"
        required: true
        default: "finalize-signed-draft"
        type: choice
        options:
          - finalize-signed-draft
          - finalize-unsigned-draft
          - repair-updater-metadata
      tag:
        description: "Release tag；修复 updater 时留空表示当前稳定版"
        required: false
        default: ""
        type: string
      version:
        description: "正式版版本号；留空则从 tag 推导"
        required: false
        default: ""
        type: string
      source_ref:
        description: "正式版私有源码引用；留空则从草稿说明读取"
        required: false
        default: ""
        type: string
      source_commit:
        description: "正式版私有源码提交；留空则从草稿说明读取"
        required: false
        default: ""
        type: string
      platforms:
        description: "正式版构建平台；留空则从草稿说明读取"
        required: false
        default: ""
        type: string
      unsigned_mode:
        description: "无签名草稿发布方式"
        required: true
        default: "formal"
        type: choice
        options:
          - formal
          - prerelease
      highlights:
        description: "可选发布要点，每行一项"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: release-maintenance-${{ inputs.tag || 'latest-stable' }}
  cancel-in-progress: false

jobs:
  maintain:
    name: ${{ inputs.operation }}
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: 检出发布调度仓库
        uses: actions/checkout@v4

      - name: 校验维护参数
        shell: bash
        env:
          OPERATION: ${{ inputs.operation }}
          TAG_NAME: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "${OPERATION}" in
            finalize-signed-draft|finalize-unsigned-draft)
              if [[ -z "${TAG_NAME//[[:space:]]/}" ]]; then
                echo "${OPERATION} 必须填写已有草稿的 tag。"
                exit 1
              fi
              ;;
            repair-updater-metadata)
              ;;
            *)
              echo "不支持的维护操作：${OPERATION}"
              exit 1
              ;;
          esac

      - name: 测试发布工具
        if: inputs.operation != 'repair-updater-metadata'
        run: python -m unittest discover -s tests -p 'test_*.py'

      - name: 发布已有签名草稿
        if: inputs.operation == 'finalize-signed-draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
          VERSION: ${{ inputs.version }}
          SOURCE_REF: ${{ inputs.source_ref }}
          SOURCE_COMMIT: ${{ inputs.source_commit }}
          PLATFORMS: ${{ inputs.platforms }}
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          set -euo pipefail
          arguments=(
            --repo "${GH_REPO}"
            --tag "${TAG_NAME}"
            --version "${VERSION}"
            --source-ref "${SOURCE_REF}"
            --source-commit "${SOURCE_COMMIT}"
            --platforms "${PLATFORMS}"
          )
          if [[ -n "${HIGHLIGHTS//[[:space:]]/}" ]]; then
            printf '%s\n' "${HIGHLIGHTS}" > release-highlights.md
            arguments+=(--highlights-file release-highlights.md)
          fi
          python scripts/finalize-release.py "${arguments[@]}"

      - name: 发布已有无签名草稿
        if: inputs.operation == 'finalize-unsigned-draft'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ inputs.tag }}
          MODE: ${{ inputs.unsigned_mode }}
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          set -euo pipefail
          arguments=(
            --repo "${GH_REPO}"
            --tag "${TAG_NAME}"
            --mode "${MODE}"
          )
          if [[ -n "${HIGHLIGHTS//[[:space:]]/}" ]]; then
            printf '%s\n' "${HIGHLIGHTS}" > release-highlights.md
            arguments+=(--highlights-file release-highlights.md)
          fi
          python scripts/finalize-unsigned-release.py "${arguments[@]}"

      - name: 修复 updater 元数据
        if: inputs.operation == 'repair-updater-metadata'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REQUESTED_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          tag="${REQUESTED_TAG}"
          if [[ -z "${tag}" ]]; then
            tag="$(gh release view --repo "${GH_REPO}" --json tagName --jq '.tagName')"
          fi
          test -n "${tag}"
          mkdir -p repair-check
          gh release download "${tag}" \
            --repo "${GH_REPO}" \
            --pattern latest.json \
            --dir repair-check
          asset_names="$(gh release view "${tag}" --repo "${GH_REPO}" --json assets --jq '.assets[].name')"
          if printf '%s\n' "${asset_names}" | grep -Fx 'SHA256SUMS-release.txt' >/dev/null; then
            gh release download "${tag}" \
              --repo "${GH_REPO}" \
              --pattern SHA256SUMS-release.txt \
              --dir repair-check
          fi
          gh api "repos/${GH_REPO}/releases/tags/${tag}" > repair-check/release.json

          python scripts/normalize-updater-metadata.py \
            --metadata repair-check/latest.json \
            --assets repair-check/release.json \
            --repo "${GH_REPO}" \
            --tag "${tag}"
          python scripts/normalize-updater-metadata.py \
            --metadata repair-check/latest.json \
            --assets repair-check/release.json \
            --repo "${GH_REPO}" \
            --tag "${tag}" \
            --check
          if [[ -f repair-check/SHA256SUMS-release.txt ]]; then
            python - <<'PY'
          import hashlib
          from pathlib import Path

          checksum_path = Path("repair-check/SHA256SUMS-release.txt")
          digest = hashlib.sha256(Path("repair-check/latest.json").read_bytes()).hexdigest()
          lines = checksum_path.read_text(encoding="utf-8").splitlines()
          replaced = False
          output = []
          for line in lines:
              fields = line.split(maxsplit=1)
              if len(fields) == 2 and Path(fields[1].lstrip("*./")).name == "latest.json":
                  output.append(f"{digest}  ./latest.json")
                  replaced = True
              else:
                  output.append(line)
          if not replaced:
              output.append(f"{digest}  ./latest.json")
          checksum_path.write_text("\n".join(output) + "\n", encoding="utf-8")
          PY
          fi
          gh release upload "${tag}" \
            --repo "${GH_REPO}" \
            repair-check/latest.json \
            --clobber
          if [[ -f repair-check/SHA256SUMS-release.txt ]]; then
            gh release upload "${tag}" \
              --repo "${GH_REPO}" \
              repair-check/SHA256SUMS-release.txt \
              --clobber
          fi
          echo "已修复 ${GH_REPO}@${tag} 的 updater 元数据。"
