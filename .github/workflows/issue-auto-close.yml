name: 等待反馈 24 小时自动关闭

# 只关闭显式标记“等待反馈”且 24 小时无作者回复的 Issue；所有其他 Issue 不受影响。
# 作者留言后会自动重新打开，完整规则见 CONTRIBUTING.md 和 scripts/issue-auto-close.py。
# 正文和评论只通过 GitHub API 读取，从不拼进脚本。

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只列出会被关闭的 Issue，不实际关闭"
        required: false
        default: false
        type: boolean
  issue_comment:
    types: [created]

permissions: {}

jobs:
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: issue-auto-close-sweep
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: 关闭等待反馈超过 24 小时的 Issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          set -euo pipefail
          gh label create "保持开启" --color 0E8A16 \
            --description "不会被 24 小时自动关闭" >/dev/null 2>&1 || true
          gh label create "等待反馈" --color FBCA04 \
            --description "等待提交者补充信息；24 小时无回复后自动关闭" >/dev/null 2>&1 || true
          args=()
          if [ "$DRY_RUN" = true ]; then
            args+=(--dry-run)
          fi
          python3 scripts/issue-auto-close.py "${args[@]}" sweep

  reopen:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request == null &&
      github.event.issue.state == 'closed' &&
      github.event.comment.user.type != 'Bot' &&
      github.event.comment.user.login == github.event.issue.user.login
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: issue-auto-close-reopen-${{ github.event.issue.number }}
      cancel-in-progress: false
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - name: 作者在自动关闭后留言时重新打开
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          COMMENTER: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          python3 scripts/issue-auto-close.py reopen --issue "$ISSUE" --commenter "$COMMENTER"
